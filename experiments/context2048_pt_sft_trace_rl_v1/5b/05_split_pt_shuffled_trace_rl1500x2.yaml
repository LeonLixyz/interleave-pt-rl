schema: context2048-pt-sft-trace-rl-experiment-v1
extends: ../shared.yaml
experiment:
  key: pt2p5b_sft3half_rl1500_reset_shuffled_trace_then_pt2p5b_sft3half_rl1500
  matrix: 5b_total_pt
  description: First 2.5B PT half, RL1500, reset, shuffled trace training, second 2.5B PT half, then RL1500
  total_pt_target_tokens: 5000000000
stages:
  - id: pt_first
    kind: pt_sft_mixed
    model_from: canonical_seeded_initialization
    pt_target_tokens: 2500000000
    sft_exposures: 116575
    placement_seed: 520200
  - id: rl_first
    kind: rl
    model_from: pt_first
    updates: 1500
  - id: trace_train
    kind: trace_supervised
    model_from: pt_first
    traces_from: rl_first
    order: shuffled
  - id: pt_second
    kind: pt_sft_mixed
    model_from: trace_train
    pt_target_tokens: 2500000000
    sft_exposures: 116576
    placement_seed: 520201
  - id: rl_final
    kind: rl
    model_from: pt_second
    updates: 1500
