schema: context2048-pt-sft-trace-rl-experiment-v1
extends: ../shared.yaml
experiment:
  key: pt2p5b_sft3half_then_pt2p5b_sft3half_two_decays_rl3000
  matrix: 5b_total_pt
  description: Two 2.5B PT stages with half of SFTx3 in each and a fresh PT decay in each stage, then 3000 RL updates
  total_pt_target_tokens: 5000000000
stages:
  - id: pt_first
    kind: pt_sft_mixed
    model_from: canonical_seeded_initialization
    pt_target_tokens: 2500000000
    sft_exposures: 116575
    placement_seed: 520200
  - id: pt_second
    kind: pt_sft_mixed
    model_from: pt_first
    pt_target_tokens: 2500000000
    sft_exposures: 116576
    placement_seed: 520201
  - id: rl_final
    kind: rl
    model_from: pt_second
    updates: 3000
