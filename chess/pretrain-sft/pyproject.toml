[project]
name = "chess-reasoning"
version = "0.1.0"
description = "Chess LLM pretraining and scaling law experiments"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.50.0",
    "accelerate>=1.10.0",
    "omegaconf>=2.3.0",
    "wandb>=0.19.0",
    "huggingface-hub>=0.28.0",
    "chess>=1.11.0",
    "numpy>=2.0.0",
    "tqdm>=4.67.0",
    "datasets>=3.0.0",
    "safetensors>=0.5.0",
    "sentencepiece>=0.2.0",
    "pandas>=2.0.0",
    "pyarrow>=17.0.0",
    "modal>=0.70.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
find-links = ["https://download.pytorch.org/whl/cu124"]
