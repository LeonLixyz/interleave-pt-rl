# Interleave experiment, Arm C (control), pretrain leg 2.
# Init: alpha1.000 run's step_60480 snapshot (= 0.600*C on the 2026-05-27 data listing).
# Continues pretraining on the NEXT 40,321 steps' worth of data (skip_shards=27,822
# drops the shards the first 60,480 steps consumed under the same seed-42 permutation).
# Leg-2 tokens: 21,139,816,448 = 40,321 steps x 524,288 tok/step (8xH200, bs32, ga2).
# B/C total pretrain = 60,480 + 40,321 = 100,801 steps == alpha1.000 baseline exactly.
# Fresh optimizer + per-leg cosine (re-warm); Arm C isolates this schedule/data-split
# effect from Arm B's mid-run RL.

model:
  architecture: "Qwen/Qwen3-0.6B"
  pretrained_model: "/checkpoints/6p5e18/20m_C_6p5e18_alpha1.000/step_60480"
  init_from_scratch: false
  reinit_embeddings: false
  load_dtype: "float32"
  block_size: 1024
  n_layer: 6
  n_head: 4
  num_key_value_heads: 4
  head_dim: 128
  n_embed: 512
  intermediate_size: 1536
  dropout: 0.0

training:
  device: "cuda"
  batch_size: 32
  gradient_accumulation_steps: 2
  epochs: 1
  experiment_name: "20m_C_6p5e18_ilv_C_pt2"
  optimizer:
    name: adamw
    lr: 1e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
  scheduler:
    name: cosine
    eta_min: 1e-4
    warmup_ratio: 0.05
  max_grad_norm: 1.0
  log_interval: 10
  num_workers: 8
  save_dir: "checkpoints"

data:
  txt_path: "/data/pretrain_v1_20b"
  pretrain_tokens: 21139816448
  eval_holdout: 2
  skip_shards: 27822

tokenizer:
  name: "LanTokenizer"
  special_tokens: ["<bos>", "<eos>", "<pad>"]
  include_move_numbers: false

logging:
  backend: "wandb"
  entity: "jingyanshen-new-york-university"
  project: "chess-scaling-C_6p5e18"
  notes: "Interleave Arm C (control): step_60480 -> +0.4C pretrain, no RL in between"
  tags: ["C_6p5e18", "20m", "interleave", "arm_C", "pt2"]
  mode: "online"
  hf_upload_repo: "chess-pre-to-post/20m_C_6p5e18_ilv_C_pt2"
