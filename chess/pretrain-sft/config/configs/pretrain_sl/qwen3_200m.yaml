# ~200M parameter Qwen3 model for scaling law experiments
# Architecture: Qwen3 (SwiGLU + RoPE + GQA), initialized from scratch
# Params: L*[2d² + 2d*d_kv + 3d*i] ≈ 231M

model:
  architecture: "Qwen/Qwen3-0.6B"
  block_size: 1024
  n_layer: 24
  n_head: 16
  num_key_value_heads: 4
  n_embed: 896
  intermediate_size: 3136
  dropout: 0.0

training:
  device: "cuda"
  batch_size: 16
  gradient_accumulation_steps: 8
  epochs: 1
  optimizer:
    name: adamw
    lr: 1e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
  scheduler:
    name: cosine
    eta_min: 1e-5
    warmup_steps: 100
  max_grad_norm: 1.0
  log_interval: 10
  save_interval: 1000
  eval_interval: 500
  eval_rollouts_interval: 2000
  num_workers: 8
  save_dir: "../../checkpoints/isoflop/qwen3_200m"

data:
  txt_path: "/scratch/al6843/chess_reasoning/data/train/tokenized"
  num_shards: 5861
  eval_holdout: 2

tokenizer:
  name: "LanTokenizer"
  special_tokens: ["<bos>", "<eos>", "<pad>"]
  include_move_numbers: false

logging:
  backend: "wandb"
  project: "chess-isoflop-scaling"
  notes: "Isoflop scaling law - Qwen3 200M params"
  mode: "online"
