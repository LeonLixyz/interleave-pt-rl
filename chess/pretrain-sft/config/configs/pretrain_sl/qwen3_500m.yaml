# ~500M parameter Qwen3 model for scaling law experiments
# Architecture: Qwen3 (SwiGLU + RoPE + GQA), initialized from scratch
# head_dim=64, d_kv=4*64=256
# Params: L*[d*d + d*d_kv + d*d_kv + d*d + d*i + d*i + i*d] ≈ 507M

model:
  architecture: "Qwen/Qwen3-0.6B"
  block_size: 1024
  n_layer: 24
  n_head: 20
  num_key_value_heads: 4
  n_embed: 1280
  intermediate_size: 4480
  dropout: 0.0

training:
  device: "cuda"
  batch_size: 16
  gradient_accumulation_steps: 8
  epochs: 1
  optimizer:
    name: adamw
    lr: 1e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
  scheduler:
    name: cosine
    eta_min: 1e-5
    warmup_steps: 100
  max_grad_norm: 1.0
  log_interval: 10
  save_interval: 1000
  eval_interval: 500
  eval_rollouts_interval: 2000
  num_workers: 8
  save_dir: "../../checkpoints/isoflop/qwen3_500m"

data:
  txt_path: "/scratch/al6843/chess_reasoning/data/train/tokenized"
  num_shards: 5861
  eval_holdout: 2

tokenizer:
  name: "LanTokenizer"
  special_tokens: ["<bos>", "<eos>", "<pad>"]
  include_move_numbers: false

logging:
  backend: "wandb"
  project: "chess-isoflop-scaling"
  notes: "Isoflop scaling law - Qwen3 500M params"
  mode: "online"
