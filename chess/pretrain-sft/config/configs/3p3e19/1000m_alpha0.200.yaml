# C_total=3.3e19, alpha=0.200
# Model: ~1000M (1015.4M params)
# Architecture: n_layer=30, n_embed=1536, n_head=24, kv_heads=8, head_dim=128, intermediate=4608
# Pretrain tokens: 1,050,652,000 (916 shards, 914 train + 2 eval)
# Estimated steps: ~32063

model:
  architecture: "Qwen/Qwen3-0.6B"
  block_size: 1024
  n_layer: 32
  n_head: 24
  num_key_value_heads: 4
  head_dim: 128
  n_embed: 1536
  intermediate_size: 4608
  dropout: 0.0

training:
  device: "cuda"
  batch_size: 32
  gradient_accumulation_steps: 1
  epochs: 1
  experiment_name: "1000m_C_3p3e19_alpha0.200"
  optimizer:
    name: adamw
    lr: 2e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
  scheduler:
    name: cosine
    eta_min: 1e-5
    warmup_ratio: 0.05
  max_grad_norm: 1.0
  log_interval: 10
  num_workers: 8
  save_dir: "checkpoints"

data:
  txt_path: "/scratch/al6843/chess_reasoning/data/train/tokenized"
  pretrain_tokens: 1050652000
  eval_holdout: 2

tokenizer:
  name: "LanTokenizer"
  special_tokens: ["<bos>", "<eos>", "<pad>"]
  include_move_numbers: false

logging:
  backend: "wandb"
  project: "chess-scaling-C_3p3e19"
  notes: "C=3.3e19 alpha=0.200 1000m"
  tags: ["C_3p3e19", "alpha0.200", "1000m"]
  mode: "online"
