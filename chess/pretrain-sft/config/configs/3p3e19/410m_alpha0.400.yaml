# C_total=3.3e19, alpha=0.400
# Model: ~410M (409.5M params)
# Architecture: n_layer=26, n_embed=1024, n_head=16, kv_heads=8, head_dim=128, intermediate=3072
# Pretrain tokens: 5,277,347,000 (4601 shards, 4599 train + 2 eval)
# Estimated steps: ~161051

model:
  architecture: "Qwen/Qwen3-0.6B"
  block_size: 1024
  n_layer: 28
  n_head: 16
  num_key_value_heads: 4
  head_dim: 128
  n_embed: 1024
  intermediate_size: 3072
  dropout: 0.0

training:
  device: "cuda"
  batch_size: 32
  gradient_accumulation_steps: 1
  epochs: 1
  experiment_name: "410m_C_3p3e19_alpha0.400"
  optimizer:
    name: adamw
    lr: 2e-3
    weight_decay: 0.1
    betas: [0.9, 0.95]
  scheduler:
    name: cosine
    eta_min: 1e-5
    warmup_ratio: 0.05
  max_grad_norm: 1.0
  log_interval: 10
  num_workers: 8
  save_dir: "checkpoints"

data:
  txt_path: "/scratch/al6843/chess_reasoning/data/train/tokenized"
  pretrain_tokens: 5277347000
  eval_holdout: 2

tokenizer:
  name: "LanTokenizer"
  special_tokens: ["<bos>", "<eos>", "<pad>"]
  include_move_numbers: false

logging:
  backend: "wandb"
  project: "chess-scaling-C_3p3e19"
  notes: "C=3.3e19 alpha=0.400 410m"
  tags: ["C_3p3e19", "alpha0.400", "410m"]
  mode: "online"
